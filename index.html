<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#6366f1">
<title>LinguaPro - منصة تعلم اللغات الاحترافية</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22LinguaPro%22%2C%22short_name%22%3A%22LinguaPro%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%236366f1%22%2C%22theme_color%22%3A%22%236366f1%22%2C%22icons%22%3A%5B%5D%7D">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ Splash Screen ============ -->
<div id="splashScreen" class="splash">
  <div class="splash-logo">🌍</div>
  <h1 class="splash-title">LinguaPro</h1>
  <p class="splash-sub">منصة تعلم اللغات الذكية</p>
  <div class="splash-loader"></div>
</div>

<!-- ============ Onboarding ============ -->
<div id="onboarding" class="onboarding hidden">
  <div class="onboarding-slide" data-slide="0">
    <div class="onboarding-icon">📚</div>
    <h2>تعلم الإنجليزية والفرنسية</h2>
    <p>من الصفر إلى الاحتراف مع منهج متدرج</p>
  </div>
  <div class="onboarding-slide hidden" data-slide="1">
    <div class="onboarding-icon">🎤</div>
    <h2>نطق ذكي بالذكاء الاصطناعي</h2>
    <p>استمع وصحح نطقك بتقنية متقدمة</p>
  </div>
  <div class="onboarding-slide hidden" data-slide="2">
    <div class="onboarding-icon">🏆</div>
    <h2>نظام تحفيزي كامل</h2>
    <p>نقاط، شارات، تحديات يومية، ومستويات</p>
  </div>
  <div class="onboarding-dots">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
  <div class="onboarding-actions">
    <button id="skipOnboarding" class="btn btn-ghost">تخطي</button>
    <button id="nextOnboarding" class="btn btn-primary">التالي</button>
  </div>
</div>

<!-- ============ App ============ -->
<div id="app" class="app hidden">

  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <div class="logo" id="logoBtn">🌍 <span>LinguaPro</span></div>
      
      <div class="stats-bar">
        <div class="stat-item streak" title="سلسلة الأيام">
          <span class="stat-icon">🔥</span>
          <span id="streakCount">0</span>
        </div>
        <div class="stat-item xp" title="نقاط الخبرة">
          <span class="stat-icon">⭐</span>
          <span id="xpCount">0</span>
        </div>
        <div class="stat-item gem" title="الجواهر">
          <span class="stat-icon">💎</span>
          <span id="gemCount">0</span>
        </div>
        <div class="stat-item heart" title="القلوب">
          <span class="stat-icon">❤️</span>
          <span id="heartCount">5</span>
        </div>
        <button class="icon-btn" id="themeToggle" title="الوضع الليلي">🌙</button>
        <button class="icon-btn" id="profileBtn" title="الملف الشخصي">👤</button>
      </div>
    </div>
    
    <!-- Progress Bar -->
    <div class="global-progress">
      <div class="global-progress-fill" id="globalProgress"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-main" id="appMain">
    <!-- Views will be rendered here -->
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">الرئيسية</span>
    </button>
    <button class="nav-btn" data-view="learn">
      <span class="nav-icon">📚</span>
      <span class="nav-label">تعلم</span>
    </button>
    <button class="nav-btn" data-view="practice">
      <span class="nav-icon">🎯</span>
      <span class="nav-label">تدرب</span>
    </button>
    <button class="nav-btn" data-view="progress">
      <span class="nav-icon">📊</span>
      <span class="nav-label">تقدمي</span>
    </button>
    <button class="nav-btn" data-view="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">حسابي</span>
    </button>
  </nav>
</div>

<!-- ============ Modals ============ -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modalContent"></div>
</div>

<!-- ============ Toast ============ -->
<div id="toast" class="toast"></div>

<!-- ============ Confetti Container ============ -->
<div id="confetti" class="confetti-container"></div>

<script src="app.js"></script>
</body>
</html>
